<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bora jogar? 🎮</title>

    <!-- ÍCONE NA ABA DO NAVEGADOR (FAVICON) -->
    <link rel="icon" href="Tropa.png" type="image/png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;

            /* CONFIGURAÇÃO DA IMAGEM DE FUNDO */
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                              url('Tropa.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #ffffff;
            padding: 20px;
        }

        /* ESTILO DA LOGO COM A MESMA FOTO DO FUNDO */
        .logo {
            width: clamp(100px, 25vw, 150px);
            height: clamp(100px, 25vw, 150px);
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            margin-bottom: 12px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            line-height: 1.2;
        }

        p {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: #e0e0e0;
            margin-bottom: 35px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .container-botoes {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
            height: 80px;
            position: relative;
        }

        button {
            padding: 14px 30px;
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #000;
            transition: transform 0.1s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #000;
        }

        #sim {
            background-color: #00E676; /* Verde chamativo */
            color: #000000;
            z-index: 2;
        }

        #nao {
            background-color: #FF1744; /* Vermelho */
            color: #ffffff;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- LOGO UTILIZANDO A IMAGEM TROPA.PNG -->
    <img src="Tropa.png" alt="Logo Tropa" class="logo">

    <h1>Bora jogar Roblox, sexta-feira? 🎮✨</h1>
    <p>Deu trabalho fazer isto com o gemini kk.</p>

    <div class="container-botoes">
        <button id="sim" onclick="aceitou()">Sim</button>
        <button id="nao">Não</button>
    </div>

    <script>
        const btnNao = document.getElementById('nao');
        let origemAcesso = "Acesso Direto / Não identificado";

        // Captura a origem assim que o site carrega
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const origemParam = urlParams.get('src');
            const origemReferrer = document.referrer;

            if (origemParam) {
                origemAcesso = origemParam;
            } else if (origemReferrer) {
                if (origemReferrer.includes('instagram.com')) origemAcesso = 'Instagram';
                else if (origemReferrer.includes('tiktok.com')) origemAcesso = 'TikTok';
                else if (origemReferrer.includes('whatsapp')) origemAcesso = 'WhatsApp';
                else if (origemReferrer.includes('discord.com')) origemAcesso = 'Discord';
                else origemAcesso = origemReferrer;
            }

            console.log("Site aberto via:", origemAcesso);
        });

        function moverBotao(e) {
            if (e) e.preventDefault(); // Evita acionar o clique no mobile

            if (btnNao.style.position !== 'fixed') {
                btnNao.style.position = 'fixed';
            }

            // Calcula limites visíveis da tela
            const padding = 20;
            const maxX = window.innerWidth - btnNao.offsetWidth - padding;
            const maxY = window.innerHeight - btnNao.offsetHeight - padding;

            const randomX = Math.random() * (maxX - padding) + padding;
            const randomY = Math.random() * (maxY - padding) + padding;

            btnNao.style.left = `${Math.max(padding, randomX)}px`;
            btnNao.style.top = `${Math.max(padding, randomY)}px`;
        }

        // Suporte para Desktop (mouse)
        btnNao.addEventListener('mouseover', moverBotao);

        // Suporte para Mobile (toque)
        btnNao.addEventListener('touchstart', moverBotao, { passive: false });
        btnNao.addEventListener('pointerdown', moverBotao);

        function aceitou() {
            alert(`Boa! Sabia que você ia aceitar (acessado via ${origemAcesso}). Te aguardo sexta-feira! 🚀💎`);
            
            // Tenta fechar a aba
            window.close();

            // Se o navegador bloquear o fecho automático da aba, redireciona para o Roblox/YouTube
            setTimeout(() => {
                window.location.href = "https://www.roblox.com";
            }, 500);
        }
    </script>

</body>
</html>
